<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mockup móvil — Registro de correspondencia</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ece7dc; font-family: Georgia, serif; color: #243041; }
    .marco { width: 360px; background: #fff; border: 1px solid #cfc6b6; }
    .nota { background: #243041; color: #fff; padding: 10px 14px; font-family: "Segoe UI", sans-serif; font-size: 13px; }
    .pantalla { padding: 18px 16px 24px; }
    h1 { margin: 0 0 8px; font-size: 22px; }
    .campo { height: 42px; border: 1px dashed #8d97a3; margin: 8px 0 14px; }
    .boton { display: block; text-align: center; padding: 12px; background: #d9d3c6; }
  </style>
</head>
<body>
  <div class="marco">
    <div class="nota">Mockup móvil · CU-01 · registro fuera del escritorio.</div>
    <div class="pantalla">
      <p>Secretaría</p>
      <h1>Nueva correspondencia</h1>
      <label>Remitente</label>
      <div class="campo"></div>
      <label>Asunto</label>
      <div class="campo"></div>
      <label>Tipo de documento</label>
      <div class="campo"></div>
      <label>Fecha de recepción</label>
      <div class="campo"></div>
      <div class="boton">Guardar</div>
    </div>
  </div>
</body>
</html>
